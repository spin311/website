# Nothing is published under /.well-known/. Without this rule the SPA fallback below
# answers those URLs (e.g. the /.well-known/ard.json agent manifest) with index.html
# and a 200, which crawlers and agents read as a broken file instead of a missing one.
[[redirects]]
  from = "/.well-known/*"
  to = "/index.html"
  status = 404

# Hashed files from an older deploy no longer exist. Answer them with a 404 instead of
# the SPA's index.html, so a stale tab's import fails cleanly and src/index.tsx reloads.
[[redirects]]
  from = "/static/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite emits its JS, CSS and fonts into /static/ with a content hash in each file name,
# so a file never changes under the same URL and browsers can keep it for a year.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
