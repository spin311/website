<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" sizes="32x32" href="/favicon.ico">
    <link rel="icon" sizes="16x16" href="/favicon.ico">
    <!-- Fonts of the first screen: fetched alongside the JS so they are ready before the
         first render, instead of swapping in afterwards and shifting the layout -->
    <link rel="preload" href="/node_modules/@fontsource/poppins/files/poppins-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/node_modules/@fontsource/kay-pho-du/files/kay-pho-du-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/node_modules/@fontsource/poppins/files/poppins-latin-ext-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/node_modules/@fontsource/kay-pho-du/files/kay-pho-du-latin-ext-700-normal.woff2" as="font" type="font/woff2" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="keywords" content="Svit Spindler, web developer, software engineer, portfolio, front-end development, React, JavaScript, full-stack development" />
    <meta name="author" content="Svit Spindler" />
    <meta name="impact-site-verification" value="9dc3a161-7b5f-443c-ba3a-1503d2ccb858" />


    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!--prerender-head-->
  </head>
  <body class="light-mode">
    <!-- Before first paint: dark-mode visitors get their theme without a light flash -->
    <script>try{if(JSON.parse(localStorage.getItem("darkMode"))===true)document.body.className="dark-mode"}catch(e){}</script>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
